name: 🔄 Surge Domain-Set 工业级转译车间
on:
  schedule:
    - cron: "0 21 * * *" # 北京时间每天清晨 5:00 自动触发同步
  workflow_dispatch:      # 允许手动一键触发

jobs:
  build_and_unpack:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 📥 同步抓取全球最权威的 Geosite 根源码 (v2fly data)
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git v2fly_src

      - name: 🧼 运行根目录下的专属编译清洗脚本
        run: |
          # 💡 直接一行命令调用你抽离出来的独立脚本
          python build_rules.py

      - name: 🚀 自动推送到你的专属 GitHub 仓库
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # 递归追踪生成的深层目录
          git add rule/surge/*.txt
          
          # 只有当文件内容真的有变动时才提交
          git diff --cached --quiet || (git commit -m "🔄 生产线同步：解耦版 Python 引擎成功转译最新 Domain-Set" && git push)
